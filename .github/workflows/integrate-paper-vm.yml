name: Integrate Preserved Paper VM Fixes
on:
  push:
    branches: [bootstrap-paper-trading-core]
    paths: [.github/workflows/integrate-paper-vm.yml]
permissions:
  contents: write
  id-token: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: paper-sim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/799227792491/locations/global/workloadIdentityPools/github-deploy-pool/providers/github-deploy-provider
          service_account: github-trading-deployer@project-79d49028-a68b-4bb1-bd9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-79d49028-a68b-4bb1-bd9
      - name: Read the exact reviewed source patch without modifying VM files
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(cat <<'EOS'
          set -euo pipefail
          cd /home/cjhaake1/trading-platform
          .venv/bin/python - <<'PY'
          import base64, gzip, hashlib, json, subprocess
          from pathlib import Path
          expected = {
              'streamlit_app.py': '4f794ecaad8f612ffd6cc16c3275a7ca10a627fcedce98a004d71df4b8f5c8d4',
              'performance_board.py': 'bc23a6de666b16fad99c50309b3f09942678e7d674c91c8935c41ec2b9e59607',
              'systemd/trading-platform-kalshi-reconciliation.service': '61db230ff185b63f09046eb6b573b4476415b24f084ade2afb66db7cac006fd2',
              'systemd/trading-platform-kalshi-research.service': '18f11bad62d78b0d0a9081ee81726b8214ec96547d73a506ba699704474f6212',
              'tests/test_streamlit_dashboard_ui.py': 'bf994cc92cea60f36822a32d0d0733b20b91bbd3f740e0c17896c3897eaa7c90',
              'tests/test_performance_board.py': 'ee80d38d166683272e86ec65ea225d60f36c194c6028dafa6819d3c46c8dff28',
              'src/autotrader/daily_report.py': '85d8a0282822bac1a318d974a70440491a0f3bae3051f43bfb11627bcc5d6aa6',
              'src/autotrader/autonomous_paper.py': '96d1648113584176c7ea1e0b0c63ccec3b76206014acb6418426e0e791f71594',
              'src/autotrader/strategy_health.py': '538ea8ea9f17f718e82955284cb2533227e21e722601dcd860494445c50fb8fb',
              'src/autotrader/kalshi/transport.py': '3b50ac5e83060c3442660be1eac09e68313ff8f1efadef82e140a2b0a22a97d7',
              'src/autotrader/kalshi/config.py': 'f7f0c2452f5aad288a3531c5254f55fc4cfd5d09a7faa39c74a07c0aaccb2ca4'
          }
          def verify():
              for name, digest in expected.items():
                  if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest:
                      raise SystemExit('Source changed after inspection: ' + name)
          if subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() != '48b40dd3da31c96f8ed3ff6484ff3dca44a576a6':
              raise SystemExit('VM source revision changed after inspection')
          verify()
          patch = subprocess.check_output(['git','diff','--binary','HEAD','--',*sorted(expected)])
          verify()
          data = {'reviewed_source_sha256': expected, 'patch': patch.decode()}
          print('REVIEWED_PATCH=' + base64.b64encode(gzip.compress(json.dumps(data).encode())).decode())
          PY
          EOS
          )
          ENCODED=$(printf '%s\n' "$SCRIPT" | base64 -w0)
          gcloud compute ssh instance-20260806-154514 --zone=us-east1-c --project=project-79d49028-a68b-4bb1-bd9 --quiet --command="echo '${ENCODED}' | base64 -d | sudo -u cjhaake1 bash" > "$RUNNER_TEMP/reviewed-source.b64"
          python - <<'PY'
          import base64, gzip, json, os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP'])/'reviewed-source.b64').read_text().splitlines()
          payloads = [line.removeprefix('REVIEWED_PATCH=') for line in lines if line.startswith('REVIEWED_PATCH=')]
          if len(payloads) != 1:
              raise SystemExit('Expected one reviewed source payload')
          data = json.loads(gzip.decompress(base64.b64decode(payloads[0], validate=True)))
          Path(os.environ['RUNNER_TEMP'],'reviewed-source.patch').write_text(data['patch'])
          Path('docs/vm-preserved-source-manifest.json').write_text(json.dumps(data['reviewed_source_sha256'], indent=2)+'\n')
          PY
          git apply --3way --index "$RUNNER_TEMP/reviewed-source.patch"
      - name: Install validation dependencies
        id: install
        run: pip install -e '.[dev,streaming]'
      - name: Mechanical import sorting
        run: |
          ruff check --fix-only .
          ruff check .
      - name: All tests with no broker credentials
        run: |
          set -euo pipefail
          python -m pytest -q | tee "$RUNNER_TEMP/preserved-source-tests.txt"
      - name: Validate source and commit reviewed integration only
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          python -m py_compile streamlit_app.py dashboard_simple.py portfolio_reporting.py runtime_income_evidence.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c fix/preserved-vm-income-20260908
          git add performance_board.py streamlit_app.py src tests systemd docs/vm-preserved-source-manifest.json
          git commit -m 'Preserve reviewed VM improvements alongside the validated $6000 income repair'
          git push origin HEAD:fix/preserved-vm-income-20260908
          git rev-parse HEAD > "$RUNNER_TEMP/preserved-source-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserved-source-validation
          path: |
            ${{ runner.temp }}/preserved-source-tests.txt
            ${{ runner.temp }}/preserved-source-sha.txt
          retention-days: 3
