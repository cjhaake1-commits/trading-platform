name: Inspect Paper VM Conflicts
on:
  push:
    branches: [fix/paper-income-baseline-20260908]
    paths: [.github/workflows/inspect-paper-vm.yml]
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: paper-sim
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/799227792491/locations/global/workloadIdentityPools/github-deploy-pool/providers/github-deploy-provider
          service_account: github-trading-deployer@project-79d49028-a68b-4bb1-bd9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-79d49028-a68b-4bb1-bd9
      - name: Read only and encrypt evidence before it leaves the VM
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(cat <<'EOS'
          set -euo pipefail
          cd /home/cjhaake1/trading-platform
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          TEMP=$(mktemp -d)
          trap 'rm -rf "$TEMP"' EXIT
          umask 077
          cat > "$TEMP/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEJzCCAo+gAwIBAgIUSK1B97JO07OGh+2WiWMTgBpcffEwDQYJKoZIhvcNAQEL
          BQAwIzEhMB8GA1UEAwwYZXBoZW1lcmFsLXRyYWRpbmctcmVwYWlyMB4XDTI2MDkw
          ODIyNDYyNVoXDTI2MDkxMDIyNDYyNVowIzEhMB8GA1UEAwwYZXBoZW1lcmFsLXRy
          YWRpbmctcmVwYWlyMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA0bwq
          iTldRCIF+FpsyH8zyz6io297pX4joCQDSjXQceRyqODX4qDlXpDfhcGPntWYGMLH
          yJXt54nTXLImD+zVJl1uTTRhuWVewUfcOZ9NBCJKCPfu3a6PbLXCxzU2eh8LZQxn
          BDBNmbEBXFA8iTBvEb5cVShAXWq+MozVdGmQfVurAtTahziKik/dSs7hnPN46L2e
          GHjAyduzxWRhde0ZRQ0qTvfF9Oldg/F1IWRm+P8xhIAi55sS4rX48A+jr4qXsRaj
          RMcp3aNEWXAsHS3JFamILzka6usUZQ0hyH1qkjYZPj3fK1jfRlYTCnwndMj4jDYv
          Cbm2u4u66NI1ywnggPVYyWVv9D0Q00HHSh2IINRFkOtKXZa9spvRX6HDlbhF74eo
          uEw82Ht4mcOwhPXK4/yJx8IILms9QvookC0FhChgAfk+owJ8JQAW13T6PB6uyTmD
          xvNRyVKytovmKICwDKPR9mOmMTVALyAT+4KNYQHxVDiXLzzafHM0caxFmrhxAgMB
          AAGjUzBRMB0GA1UdDgQWBBQltwqelEA6j6U4/F5OskvSEAAnYDAfBgNVHSMEGDAW
          gBQltwqelEA6j6U4/F5OskvSEAAnYDAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3
          DQEBCwUAA4IBgQCp9fsrnqHNOReNIiY69D/CKGx2jHv/Tckn92NFukMcJyAJmSZo
          IS/geq/W3rh6zsMl5nEC2LPfPtjvkYUAbWtBcloXvEMdVV5YzdFIY1dkbnWg9Ten
          PHUveoCnUwQ7VaseHKzxKke/jpkcy+z7XJJbHPhguseE79yta/JmkkZUshq3a7u3
          XtdgA8PAmHSFXCT3SP7O6ds15/vvqXML9faHF9ibWDo+o6JxxToybRjGZuiFeuy5
          K5VVjVxHx3Pz3+4k11sM8jrkdFnRTgOPaF+FNE4AJsey548+I2cu8EOGGCTS7h76
          U10I1/arFROLjiiVYFX4xTUyW/AyQ6ecHi/rr/mhH9MS7MdU6eGlC+c1SO5vixSk
          uADWiP4VVUqImbYv4dzIVPcnnvNpON/I1CR1/gZnE5Xc7+k7wIa8iMjkc+7oIOaM
          CtZ3ka61uRBCFJtRCRhhLZBPVJGe6Ojrpyo2txvCamBEWZDr3Gq/rf5gDEL0psL9
          WF90+RqHPyzQG8U=
          -----END CERTIFICATE-----
          CERT
          .venv/bin/python - "$TEMP/evidence.tar.gz" <<'PY'
          import io, json, sqlite3, subprocess, sys, tarfile
          from pathlib import Path
          from contextlib import closing
          allowed = ['performance_board.py', 'src/autotrader/autonomous_paper.py', 'src/autotrader/daily_report.py', 'src/autotrader/kalshi/config.py', 'src/autotrader/kalshi/transport.py', 'src/autotrader/strategy_health.py', 'streamlit_app.py', 'systemd/trading-platform-kalshi-reconciliation.service', 'systemd/trading-platform-kalshi-research.service', 'tests/test_performance_board.py', 'tests/test_streamlit_dashboard_ui.py']
          def command(*args):
              result = subprocess.run(args, capture_output=True, timeout=20)
              return result.stdout + result.stderr
          contents = {'source.patch': command('git','diff','HEAD','--',*allowed), 'git-status.txt': command('git','status','--porcelain'), 'head.txt': command('git','rev-parse','HEAD')}
          for name in allowed:
              path = Path(name)
              if path.is_file():
                  contents['source/' + name] = path.read_bytes()
          for name in ('var/runtime/external_status.json', 'var/runtime/publisher_health.json', 'var/autotrader/status.json', 'var/autotrader/foundation-report.json'):
              path = Path(name)
              if path.is_file():
                  contents[name] = path.read_bytes()
          for unit in ('trading-platform-paper-runtime.service', 'trading-platform-streamlit.service', 'trading-platform-runtime-publisher.service'):
              contents['services/' + unit + '.txt'] = command('systemctl','--user','show',unit,'-p','ActiveState','-p','SubState','-p','MainPID','-p','ExecStart','-p','FragmentPath')
              contents['logs/' + unit + '.txt'] = command('journalctl','--user','-u',unit,'-n','80','--no-pager','-o','cat')
          data = {}
          path = Path('var/autotrader/portfolio.db').resolve()
          try:
              with closing(sqlite3.connect(path.as_uri()+'?mode=ro', uri=True, timeout=3)) as db:
                  db.row_factory = sqlite3.Row
                  for key, query in {
                      'portfolio_state': 'SELECT * FROM portfolio_state',
                      'day_start': 'SELECT * FROM pillar_day_start_equity ORDER BY equity_date DESC LIMIT 36',
                      'accounting': 'SELECT * FROM pillar_accounting_snapshot',
                      'positions': 'SELECT symbol,asset_class,quantity,average_price,realized_pnl,opened_at,updated_at FROM positions',
                  }.items():
                      try:
                          data[key] = [dict(row) for row in db.execute(query)]
                      except sqlite3.Error as exc:
                          data[key] = {'error_type': type(exc).__name__}
          except sqlite3.Error as exc:
              data['error_type'] = type(exc).__name__
          contents['economic-state.json'] = json.dumps(data, indent=2).encode()
          with tarfile.open(sys.argv[1], 'w:gz') as archive:
              for name, content in contents.items():
                  info = tarfile.TarInfo(name)
                  info.size = len(content)
                  info.mode = 0o600
                  archive.addfile(info, io.BytesIO(content))
          PY
          openssl cms -encrypt -binary -aes-256-cbc -in "$TEMP/evidence.tar.gz" -out "$TEMP/evidence.der" -outform DER "$TEMP/recipient.pem"
          echo BEGIN_ENCRYPTED_REPAIR_DATA
          base64 -w0 "$TEMP/evidence.der"
          printf '\nEND_ENCRYPTED_REPAIR_DATA\n'
          EOS
          )
          ENCODED=$(printf '%s\n' "$SCRIPT" | base64 -w0)
          gcloud compute ssh instance-20260806-154514 --zone=us-east1-c --project=project-79d49028-a68b-4bb1-bd9 --quiet --command="echo '${ENCODED}' | base64 -d | sudo -u cjhaake1 bash" > "$RUNNER_TEMP/encrypted-output.txt"
          python - <<'PY'
          import base64, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          output = (root/'encrypted-output.txt').read_text()
          ciphertext = output.split('BEGIN_ENCRYPTED_REPAIR_DATA\n',1)[1].split('\nEND_ENCRYPTED_REPAIR_DATA',1)[0]
          (root/'paper-vm-evidence.der').write_bytes(base64.b64decode(ciphertext, validate=True))
          print('Encrypted evidence captured; no plaintext source or economic state published.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-paper-vm-evidence
          path: ${{ runner.temp }}/paper-vm-evidence.der
          retention-days: 1
