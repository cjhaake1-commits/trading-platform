name: Deploy GCP Paper Platform

on:
  push:
    branches: [bootstrap-paper-trading-core]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: trading-platform-gcp-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev,streaming]'
      - name: Full repository lint
        run: ruff check .
      - name: Full tests
        run: python -m pytest -q
      - name: Compile
        run: |
          python -m compileall -q src tests scripts
          python -m py_compile streamlit_app.py dashboard_simple.py portfolio_reporting.py runtime_income_evidence.py
          git diff --check
      - name: Verify owner-approved initial paper capital
        run: |
          python - <<'PY'
          from autotrader.capital_allocations import SIX_PILLAR_BASE_CAPITAL, SIX_PILLAR_ALLOCATIONS
          assert SIX_PILLAR_BASE_CAPITAL == 6000
          assert len(SIX_PILLAR_ALLOCATIONS) == 6
          assert set(SIX_PILLAR_ALLOCATIONS.values()) == {1000.0}
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: paper-sim
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/799227792491/locations/global/workloadIdentityPools/github-deploy-pool/providers/github-deploy-provider
          service_account: github-trading-deployer@project-79d49028-a68b-4bb1-bd9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-79d49028-a68b-4bb1-bd9
      - name: Deploy exact tested code with source and ledger preservation
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(cat <<'EOS'
          set -euo pipefail
          cd /home/cjhaake1/trading-platform
          TARGET=${1:?tested SHA required}
          git fetch origin bootstrap-paper-trading-core
          TEMP=$(mktemp)
          trap 'rm -f "$TEMP"' EXIT
          chmod 600 "$TEMP"
          git show "$TARGET:scripts/deploy_reviewed_income.py" > "$TEMP"
          .venv/bin/python "$TEMP" --target "$TARGET"

          # Install an explicit PAPER-only stress-mode override. The override
          # changes cadence/selection/utilization only; runtime_stress itself
          # hard-disables live trading and keeps the $1,000 pillar caps.
          mkdir -p "$HOME/.config/systemd/user/trading-platform-paper-runtime.service.d"
          cat > "$HOME/.config/systemd/user/trading-platform-paper-runtime.service.d/stress.conf" <<'UNIT'
          [Service]
          ExecStart=
          ExecStart=/home/cjhaake1/trading-platform/.venv/bin/python -m autotrader.runtime_stress --mode paper --audit-db var/autotrader/audit.db --status var/autotrader/status.json --heartbeat 1 --trade-cadence 30 --ledger var/autotrader/portfolio.db --idempotency var/autotrader/idempotency.db --initial-equity 5000 --autonomous-paper
          Environment=LIVE_TRADING_ENABLED=false
          Environment=KALSHI_LIVE_TRADING_ENABLED=false
          Environment=AUTONOMOUS_TRADING_ENABLED=true
          Environment=PAPER_STRESS_MODE=true
          Environment=METALS_MIN_CASH_RESERVE_PCT=0
          Environment=SAXO_MIN_CASH_RESERVE_PCT=0
          UNIT
          systemctl --user daemon-reload
          systemctl --user restart trading-platform-paper-runtime.service
          sleep 5
          systemctl --user is-active --quiet trading-platform-paper-runtime.service

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user start trading-platform-runtime-publisher.service
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from portfolio_reporting import build_report
          report = build_report(Path.cwd())
          print('REPORT=' + json.dumps(report, allow_nan=False))
          PY
          EOS
          )
          ENCODED=$(printf '%s\n' "$SCRIPT" | base64 -w0)
          gcloud compute ssh instance-20260806-154514 --zone=us-east1-c \
            --project=project-79d49028-a68b-4bb1-bd9 --quiet \
            --command="echo '${ENCODED}' | base64 -d | sudo -u cjhaake1 bash -s -- '${{ github.sha }}'"
      - name: Existing public dashboard health
        run: |
          set -euo pipefail
          IP=$(gcloud compute instances describe instance-20260806-154514 \
            --zone=us-east1-c --project=project-79d49028-a68b-4bb1-bd9 \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "Dashboard: http://${IP}:8501"
          curl -fsS --max-time 20 "http://${IP}:8501/_stcore/health"
